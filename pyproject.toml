[project]
name = "hover"
version = "1.0.0"
description = "A quadrotor flight-controller simulator: rigid-body physics, an error-state Kalman filter, and a cascaded PID controller."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
